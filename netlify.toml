[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # GEMINI_API_KEY is only read server-side (src/lib/ai/config.ts), but Turbopack's
  # build cache stores env values verbatim, which trips Netlify's secrets scanner.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**,.netlify/cache/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
